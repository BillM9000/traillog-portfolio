services:
  crew614:
    build: .
    container_name: crew614
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3614:3614"
    volumes:
      - crew614_data:/app/data
    environment:
      - PORT=3614
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - SESSION_SECRET=${SESSION_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://traillog.gracezero.ai/auth/google/callback
      - APP_URL=https://traillog.gracezero.ai
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    labels:
      - traefik.enable=true
      # HTTPS router
      - traefik.http.routers.crew614.rule=Host(`traillog.gracezero.ai`)
      - traefik.http.routers.crew614.entrypoints=websecure
      - traefik.http.routers.crew614.tls=true
      - traefik.http.routers.crew614.tls.certresolver=mytlschallenge
      # HTTP → HTTPS redirect
      - traefik.http.routers.crew614-http.rule=Host(`traillog.gracezero.ai`)
      - traefik.http.routers.crew614-http.entrypoints=web
      - traefik.http.routers.crew614-http.middlewares=crew614-redirect
      - traefik.http.middlewares.crew614-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.crew614-redirect.redirectscheme.permanent=true
      - traefik.http.services.crew614.loadbalancer.server.port=3614
    networks:
      - n8n_default

volumes:
  crew614_data:

networks:
  n8n_default:
    external: true
